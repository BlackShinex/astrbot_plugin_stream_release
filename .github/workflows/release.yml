name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          cd ..
          ROOT=$(basename "$GITHUB_WORKSPACE")
          zip -r "${ROOT}-${GITHUB_REF_NAME}.zip" "$ROOT" \
            -x "$ROOT/.git/*" "$ROOT/__pycache__/*" "*/__pycache__/*" "$ROOT/downloads/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/../*.zip
          generate_release_notes: true
